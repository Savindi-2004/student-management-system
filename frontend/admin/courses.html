<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Courses — Admin</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="dash">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span> Admin</div>
    <nav class="side-links sidebar-scroll">
      <a class="side-link" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="side-link" href="manage-students.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Students
      </a>
      <a class="side-link" href="teachers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>
        Teachers
      </a>
      <a class="side-link" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
        Attendance
      </a>
      <button class="side-link active" data-nav="courses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Courses
      </button>
      <a class="side-link" href="exams.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a class="side-link" href="timetable.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Timetable
      </a>

      <a class="side-link" href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments
      </a>
    </nav>
    <div class="side-user">
      <div class="who">Logged in as<br /><strong id="adminName">—</strong></div>
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h1>Courses</h1>
        <p>Manage the degree programs offered by the university.</p>
      </div>
      <button class="btn btn-primary" id="openAddModal">+ Add Course</button>
    </div>

    <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr);">
      <div class="stat-card">
        <div class="label">Total Courses</div>
        <div class="value" id="statTotalCourses">—</div>
        <div style="font-size:0.82rem; color:var(--ink-soft); margin-top:4px;"></div>
      </div>
      <div class="stat-card">
        <div class="label">Active Enrolments</div>
        <div class="value" id="statActiveEnrolments">—</div>
        <div style="font-size:0.82rem; color:var(--ink-soft); margin-top:4px;"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="card-body" style="padding:20px 22px;">
        <div class="field" style="margin-bottom:0; max-width:340px;">
          <label for="facultyFilter">Faculty</label>
          <select id="facultyFilter"><option value="">Select a faculty...</option></select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>All Courses</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by ID or name" />
        </div>
      </div>
      <div class="card-body table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Course Name</th><th>Enrolled</th><th>Description</th><th></th></tr></thead>
          <tbody id="coursesTableBody"><tr><td colspan="5" style="text-align:center; color:var(--ink-soft);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="courseModal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Add Course</h2><button class="modal-close" id="closeModal">&times;</button></div>
    <div class="modal-body">
      <div id="modalMsg" class="form-msg"></div>
      <form id="courseForm">
        <input type="hidden" id="courseId" />
        <div class="field-row">
          <div class="field"><label for="cCode">Course Code</label><input type="text" id="cCode" placeholder="e.g. CS101" required /></div>
          <div class="field"><label for="cFaculty">Faculty</label><input type="text" id="cFaculty" placeholder="e.g. Computing" /></div>
        </div>
        <div class="field"><label for="cName">Course Name</label><input type="text" id="cName" placeholder="e.g. BSc (Hons) in Computer Science" required /></div>
        <div class="field"><label for="cDesc">Description</label><textarea id="cDesc" rows="3"></textarea></div>
      </form>
    </div>
   <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveCourseBtn">Save Course</button>
    </div>
  </div>
</div>

<!-- Modules Modal -->
<div class="modal-overlay" id="modulesModal">
  <div class="modal" style="max-width:640px;">
    <div class="modal-head"><h2 id="modulesModalTitle">Modules</h2><button class="modal-close" id="closeModulesModal">&times;</button></div>
    <div class="modal-body">
      <div id="modulesMsg" class="form-msg"></div>

      <form id="moduleForm" class="field-row" style="align-items:end; margin-bottom:18px;">
        <input type="hidden" id="moduleId" />
        <div class="field"><label for="mCode">Code</label><input type="text" id="mCode" placeholder="e.g. CS101-M1" /></div>
        <div class="field"><label for="mName">Module name</label><input type="text" id="mName" placeholder="e.g. Data Structures" required /></div>
        <div class="field"><label for="mCredits">Credits</label><input type="number" id="mCredits" min="0" style="width:80px;" /></div>
        <div class="field" style="margin-bottom:0;"><button type="submit" class="btn btn-primary btn-block" id="saveModuleBtn">Add</button></div>
      </form>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Module</th><th>Credits</th><th></th></tr></thead>
          <tbody id="modulesTableBody"><tr><td colspan="4" style="text-align:center; color:var(--ink-soft);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="closeModulesModal2">Close</button>
    </div>
  </div>
</div>

<script src="../js/admin.js"></script>
<script>
  let allCourses = [];
  const tbody = document.getElementById("coursesTableBody");
  const modal = document.getElementById("courseModal");
  const modalMsg = document.getElementById("modalMsg");
  const saveBtn = document.getElementById("saveCourseBtn");

  function renderTable(list) {
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><h3>No courses found</h3><p>Try a different search, or select another faculty.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = list.map((c) => `
      <tr>
        <td><span class="reg-no">${c.course_code}</span></td>
        <td>${c.course_name}</td>
        <td>${c.enrolled_count}</td>
        <td style="max-width:260px; white-space:normal; color:var(--ink-soft); font-size:0.86rem;">${c.description || "—"}</td>
        <td>
          <div class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="openModulesModal(${c.id}, '${c.course_name.replace(/'/g, "")}')">Modules</button>
            <button class="btn btn-ghost btn-sm" onclick="openEditModal(${c.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="handleDelete(${c.id}, '${c.course_name.replace(/'/g, "")}')">Delete</button>
          </div>
        </td>
      </tr>`).join("");
  }

  async function loadStats() {
    const res = await fetch(`${API_BASE}/courses/stats`, { credentials: "include" });
    const data = await res.json();
    document.getElementById("statTotalCourses").textContent = data.totalCourses ?? 0;
    document.getElementById("statActiveEnrolments").textContent = data.activeEnrolments ?? 0;
  }

  async function loadCourses() {
    try {
      const res = await fetch(`${API_BASE}/courses`, { credentials: "include" });
      const data = await res.json();
      allCourses = data.courses || [];

      const faculties = [...new Set(allCourses.map((c) => c.faculty).filter(Boolean))].sort();
      document.getElementById("facultyFilter").innerHTML =
        `<option value="">Select a faculty...</option>` + faculties.map((f) => `<option value="${f}">${f}</option>`).join("");

      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--danger);">Could not load courses.</td></tr>`;
    }
  }

  function applyFilters() {
    const faculty = document.getElementById("facultyFilter").value;
    if (!faculty) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><h3>Select a faculty</h3><p>Choose a faculty above to view its courses.</p></div></td></tr>`;
      return;
    }
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const filtered = allCourses.filter((c) => {
      const matchesFaculty = c.faculty === faculty;
      const matchesSearch = !q || c.course_code.toLowerCase().includes(q) || c.course_name.toLowerCase().includes(q);
      return matchesFaculty && matchesSearch;
    });
    renderTable(filtered);
  }
  document.getElementById("facultyFilter").addEventListener("change", applyFilters);
  document.getElementById("searchInput").addEventListener("input", applyFilters);
  function resetForm() {
    document.getElementById("courseForm").reset();
    document.getElementById("courseId").value = "";
    document.getElementById("cCode").disabled = false;
    modalMsg.className = "form-msg";
  }

  document.getElementById("openAddModal").addEventListener("click", () => {
    resetForm();
    document.getElementById("modalTitle").textContent = "Add Course";
    modal.classList.add("open");
  });

  window.openEditModal = function (id) {
    resetForm();
    const c = allCourses.find((x) => x.id === id);
    if (!c) return;
    document.getElementById("modalTitle").textContent = "Edit Course";
    document.getElementById("courseId").value = c.id;
    document.getElementById("cCode").value = c.course_code;
    document.getElementById("cCode").disabled = true;
    document.getElementById("cName").value = c.course_name;
    document.getElementById("cFaculty").value = c.faculty || "";
    document.getElementById("cDesc").value = c.description || "";
    modal.classList.add("open");
  };

  window.handleDelete = async function (id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${API_BASE}/courses/${id}`, { method: "DELETE", credentials: "include" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadCourses();
      await loadStats();
    } catch (err) { alert(err.message); }
  };

  function closeModal() { modal.classList.remove("open"); }
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  saveBtn.addEventListener("click", async () => {
    const id = document.getElementById("courseId").value;
    const form = document.getElementById("courseForm");
    if (!form.reportValidity()) return;

    const payload = {
      courseCode: document.getElementById("cCode").value.trim(),
      courseName: document.getElementById("cName").value.trim(),
      faculty: document.getElementById("cFaculty").value.trim(),
      description: document.getElementById("cDesc").value.trim(),
    };

    saveBtn.disabled = true; saveBtn.textContent = "Saving...";
    try {
      const url = id ? `${API_BASE}/courses/${id}` : `${API_BASE}/courses`;
      const method = id ? "PUT" : "POST";
      const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      closeModal();
      await loadCourses();
      await loadStats();
    } catch (err) {
      modalMsg.textContent = err.message;
      modalMsg.className = "form-msg error";
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = "Save Course";
    }
  });
  // ---------- Modules ----------
  let currentModulesCourseId = null;
  const modulesModal = document.getElementById("modulesModal");
  const modulesMsg = document.getElementById("modulesMsg");
  const moduleForm = document.getElementById("moduleForm");
  const saveModuleBtn = document.getElementById("saveModuleBtn");

  window.openModulesModal = async function (courseId, courseName) {
    currentModulesCourseId = courseId;
    document.getElementById("modulesModalTitle").textContent = `Modules — ${courseName}`;
    resetModuleForm();
    modulesModal.classList.add("open");
    await loadModules();
  };

  function resetModuleForm() {
    moduleForm.reset();
    document.getElementById("moduleId").value = "";
    saveModuleBtn.textContent = "Add";
    modulesMsg.className = "form-msg";
  }

  async function loadModules() {
    const body = document.getElementById("modulesTableBody");
    try {
      const res = await fetch(`${API_BASE}/courses/${currentModulesCourseId}/modules`, { credentials: "include" });
      const data = await res.json();
      const modules = data.modules || [];
      body.innerHTML = modules.length
        ? modules.map((m) => `
          <tr>
            <td><span class="reg-no">${m.module_code || "—"}</span></td>
            <td>${m.module_name}</td>
            <td>${m.credits ?? "—"}</td>
            <td>
              <div class="row-actions">
                <button class="btn btn-ghost btn-sm" onclick="editModule(${m.id}, '${(m.module_code || "").replace(/'/g, "")}', '${m.module_name.replace(/'/g, "")}', ${m.credits ?? "null"})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteModule(${m.id})">Delete</button>
              </div>
            </td>
          </tr>`).join("")
        : `<tr><td colspan="4" style="text-align:center; color:var(--ink-soft);">No modules added yet.</td></tr>`;
    } catch (err) {
      body.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--danger);">Could not load modules.</td></tr>`;
    }
  }

  window.editModule = function (id, code, name, credits) {
    document.getElementById("moduleId").value = id;
    document.getElementById("mCode").value = code;
    document.getElementById("mName").value = name;
    document.getElementById("mCredits").value = credits ?? "";
    saveModuleBtn.textContent = "Update";
  };

  window.deleteModule = async function (id) {
    if (!confirm("Remove this module?")) return;
    const res = await fetch(`${API_BASE}/modules/${id}`, { method: "DELETE", credentials: "include" });
    const data = await res.json();
    if (!res.ok) return alert(data.message);
    await loadModules();
  };

  moduleForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("moduleId").value;
    const payload = {
      moduleCode: document.getElementById("mCode").value.trim(),
      moduleName: document.getElementById("mName").value.trim(),
      credits: document.getElementById("mCredits").value || null,
    };
    try {
      const url = id ? `${API_BASE}/modules/${id}` : `${API_BASE}/courses/${currentModulesCourseId}/modules`;
      const method = id ? "PUT" : "POST";
      const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      resetModuleForm();
      await loadModules();
    } catch (err) {
      modulesMsg.textContent = err.message;
      modulesMsg.className = "form-msg error";
    }
  });

  function closeModulesModal() { modulesModal.classList.remove("open"); }
  document.getElementById("closeModulesModal").addEventListener("click", closeModulesModal);
  document.getElementById("closeModulesModal2").addEventListener("click", closeModulesModal);
  modulesModal.addEventListener("click", (e) => { if (e.target === modulesModal) closeModulesModal(); });

  (async function init() {
    await requireAdminSession();
    await loadStats();
    await loadCourses();
  })();
</script>
</body>
</html>
