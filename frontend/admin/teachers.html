<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teachers — Admin</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="dash">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span> Admin</div>
    <nav class="side-links sidebar-scroll">
      <a class="side-link" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="side-link" href="manage-students.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Students
      </a>
      <button class="side-link active" data-nav="teachers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>
        Teachers
      </button>
      <a class="side-link" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
        Attendance
      </a>
      <a class="side-link" href="courses.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Courses
      </a>
      <a class="side-link" href="exams.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a class="side-link" href="timetable.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Timetable
      </a>

      <a class="side-link" href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments
      </a>
    </nav>
    <div class="side-user">
      <div class="who">Logged in as<br /><strong id="adminName">—</strong></div>
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h1>Teachers</h1>
        <p>Create, view, update, and delete teacher records.</p>
      </div>
      <button class="btn btn-primary" id="openAddModal">+ Add Teacher</button>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>All Teachers</h2>
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search by ID, name, course, or faculty" /></div>
      </div>
      <div class="card-body table-wrap">
        <table>
          <thead><tr><th>Reg. No.</th><th>Name</th><th>Faculty</th><th>Course</th><th>Contact</th><th>Email</th><th></th></tr></thead>
          <tbody id="teachersTableBody"><tr><td colspan="7" style="text-align:center; color:var(--ink-soft);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="teacherModal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Add Teacher</h2><button class="modal-close" id="closeModal">&times;</button></div>
    <div class="modal-body">
      <div id="modalMsg" class="form-msg"></div>
      <form id="teacherForm">
        <input type="hidden" id="teacherId" />
        <div class="field-row">
          <div class="field"><label for="tName">Full name</label><input type="text" id="tName" required /></div>
          <div class="field"><label for="tRegNo">Registration No.</label><input type="text" id="tRegNo" required /></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="tEmail">Email</label><input type="email" id="tEmail" /></div>
          <div class="field"><label for="tContact">Contact number</label><input type="text" id="tContact" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="tFaculty">Faculty</label><input type="text" id="tFaculty" placeholder="e.g. Computing" /></div>
          <div class="field"><label for="tCourse">Course / Subject</label><input type="text" id="tCourse" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="tQualification">Qualification</label><input type="text" id="tQualification" placeholder="e.g. MSc, PhD" /></div>
          <div class="field"><label for="tJoined">Joined date</label><input type="date" id="tJoined" /></div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveTeacherBtn">Save Teacher</button>
    </div>
  </div>
</div>

<script src="../js/admin.js"></script>
<script>
  let allTeachers = [];
  const tbody = document.getElementById("teachersTableBody");
  const modal = document.getElementById("teacherModal");
  const modalMsg = document.getElementById("modalMsg");
  const saveBtn = document.getElementById("saveTeacherBtn");

  function renderTable(list) {
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><h3>No teachers found</h3><p>Try a different search, or add a new teacher.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = list.map((t) => `
      <tr>
        <td><span class="reg-no">${t.teacher_reg_no}</span></td>
        <td>${t.name}</td>
        <td>${t.faculty || "—"}</td>
        <td>${t.course || "—"}</td>
        <td>${t.contact_no || "—"}</td>
        <td>${t.email || "—"}</td>
        <td>
          <div class="row-actions">
            <button class="btn btn-ghost btn-sm" onclick="openEditModal(${t.id})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="handleDelete(${t.id}, '${t.name.replace(/'/g, "")}')">Delete</button>
          </div>
        </td>
      </tr>`).join("");
  }

  async function loadTeachers() {
    try {
      const res = await fetch(`${API_BASE}/teachers`, { credentials: "include" });
      const data = await res.json();
      allTeachers = data.teachers || [];
      renderTable(allTeachers);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--danger);">Could not load teachers.</td></tr>`;
    }
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase().trim();
    renderTable(allTeachers.filter((t) =>
      t.name.toLowerCase().includes(q) ||
      String(t.id).includes(q) ||
      (t.course || "").toLowerCase().includes(q) ||
      (t.faculty || "").toLowerCase().includes(q)
    ));
  });

  function resetForm() {
    document.getElementById("teacherForm").reset();
    document.getElementById("teacherId").value = "";
    document.getElementById("tRegNo").disabled = false;
    modalMsg.className = "form-msg";
  }

  document.getElementById("openAddModal").addEventListener("click", () => {
    resetForm();
    document.getElementById("modalTitle").textContent = "Add Teacher";
    modal.classList.add("open");
  });

  window.openEditModal = function (id) {
    resetForm();
    const t = allTeachers.find((x) => x.id === id);
    if (!t) return;
    document.getElementById("modalTitle").textContent = "Edit Teacher";
    document.getElementById("teacherId").value = t.id;
    document.getElementById("tName").value = t.name;
    document.getElementById("tRegNo").value = t.teacher_reg_no;
    document.getElementById("tRegNo").disabled = true;
    document.getElementById("tEmail").value = t.email || "";
    document.getElementById("tContact").value = t.contact_no || "";
    document.getElementById("tFaculty").value = t.faculty || "";
    document.getElementById("tCourse").value = t.course || "";
    document.getElementById("tQualification").value = t.qualification || "";
    document.getElementById("tJoined").value = t.joined_date ? t.joined_date.split("T")[0] : "";
    modal.classList.add("open");
  };

  window.handleDelete = async function (id, name) {
    if (!confirm(`Delete ${name}'s teacher record? This cannot be undone.`)) return;
    try {
      const res = await fetch(`${API_BASE}/teachers/${id}`, { method: "DELETE", credentials: "include" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      await loadTeachers();
    } catch (err) { alert(err.message); }
  };

  function closeModal() { modal.classList.remove("open"); }
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  saveBtn.addEventListener("click", async () => {
    const id = document.getElementById("teacherId").value;
    const form = document.getElementById("teacherForm");
    if (!form.reportValidity()) return;

    const payload = {
      name: document.getElementById("tName").value.trim(),
      teacherRegNo: document.getElementById("tRegNo").value.trim(),
      email: document.getElementById("tEmail").value.trim(),
      contactNo: document.getElementById("tContact").value.trim(),
      faculty: document.getElementById("tFaculty").value.trim(),
      course: document.getElementById("tCourse").value.trim(),
      qualification: document.getElementById("tQualification").value.trim(),
      joinedDate: document.getElementById("tJoined").value || null,
    };

    saveBtn.disabled = true; saveBtn.textContent = "Saving...";
    try {
      const url = id ? `${API_BASE}/teachers/${id}` : `${API_BASE}/teachers`;
      const method = id ? "PUT" : "POST";
      const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      closeModal();
      await loadTeachers();
    } catch (err) {
      modalMsg.textContent = err.message;
      modalMsg.className = "form-msg error";
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = "Save Teacher";
    }
  });

  (async function init() {
    await requireAdminSession();
    await loadTeachers();
  })();
</script>
</body>
</html>
