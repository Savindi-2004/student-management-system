<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — Student Manager</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card wide">
    <div class="auth-head">
      <h1>Create a student account</h1>
      <p>Fill in your details to get access to your dashboard.</p>
    </div>

    <div id="formMsg" class="form-msg"></div>

    <form id="registerForm">
      <div class="field-row">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Full name" required />
        </div>
        <div class="field">
          <label for="studentRegNo">Registration No.</label>
          <input type="text" id="studentRegNo" name="studentRegNo" placeholder="e.g. STU-2026-001" required />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob" />
        </div>
        <div class="field">
          <label for="contactNo">Contact number</label>
          <input type="text" id="contactNo" name="contactNo" placeholder="07XXXXXXXX" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="course">Course</label>
          <select id="course" name="course" required><option value="">Loading courses...</option></select>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Address" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create account</button>
    </form>

    <p class="auth-foot">
      Already have an account? <a href="login.html" style="color:var(--brass); font-weight:600;">Log in</a>
    </p>
  </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
