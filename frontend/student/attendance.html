  <main class="main">
    <div class="main-head">
      <div>
        <h1>Attendance</h1>
        <p>Mark yourself present for today's lectures and track your record.</p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="label">Overall Attendance</div><div class="value" id="statOverall">—</div></div>
      <div class="stat-card"><div class="label">Present</div><div class="value" id="statPresent" style="color:var(--success);">—</div></div>
      <div class="stat-card"><div class="label">Absent</div><div class="value" id="statAbsent" style="color:var(--danger);">—</div></div>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <div class="card-head"><h2 id="todayHeading">Today's Lectures</h2></div>
      <div class="card-body" id="todayLecturesBody">
        <div class="panel-empty">Loading...</div>
      </div>
    </div>

        <div class="card">
      <div class="card-head"><h2>Attendance Records</h2></div>
      <div class="card-body" id="attendanceRecordsBody">
        <div class="panel-empty">Loading...</div>
      </div>
    </div>
  </main>
</div>

<!-- Confirm identity to mark attendance -->
<div class="modal-overlay" id="markModal">
  <div class="modal">
    <div class="modal-head"><h2>Confirm Attendance</h2><button class="modal-close" id="closeMarkModal">&times;</button></div>
    <div class="modal-body">
      <p style="color:var(--ink-soft); font-size:0.9rem; margin-bottom:18px;" id="markLectureLabel"></p>
      <div id="markMsg" class="form-msg"></div>
      <form id="markForm">
        <div class="field">
          <label for="markPassword">Enter your password to confirm</label>
          <input type="password" id="markPassword" required />
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelMark">Cancel</button>
      <button class="btn btn-primary" id="confirmMarkBtn">Mark Present</button>
    </div>
  </div>
</div> 

<script src="../js/student-common.js"></script>
<script>
  let currentTimetableId = null;

  function fmtTime(t) {
    if (!t) return "—";
    const [h, m] = t.split(":");
    const hour = parseInt(h, 10);
    const ampm = hour >= 12 ? "PM" : "AM";
    const h12 = hour % 12 || 12;
    return `${h12}:${m} ${ampm}`;
  }
  function badgeFor(status) {
    const cls = status === "Present" ? "badge-present" : status === "Absent" ? "badge-absent" : "badge-late";
    return `<span class="badge ${cls}">${status}</span>`;
  }

   async function loadSummary() {
    const res = await fetch(`${API_BASE}/attendance/me/summary`, { credentials: "include" });
    const data = await res.json();
    document.getElementById("statOverall").textContent = data.overallPercentage + "%";
    document.getElementById("statPresent").textContent = data.present;
    document.getElementById("statAbsent").textContent = data.absent;
  }

  const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  function toDateOnly(d) {
    const copy = new Date(d);
    copy.setHours(0, 0, 0, 0);
    return copy;
  }

  // Builds one accordion card per subject: every past weekly lecture date
  // (since enrolment) is a "session" — marked Present/Late if a record
  // exists for that date, otherwise automatically shown as Absent.
  async function loadAttendanceRecords() {
    const box = document.getElementById("attendanceRecordsBody");
    try {
      const [ttRes, recRes, profRes] = await Promise.all([
        fetch(`${API_BASE}/timetable/mine`, { credentials: "include" }),
        fetch(`${API_BASE}/attendance/me`, { credentials: "include" }),
        fetch(`${API_BASE}/students/me/profile`, { credentials: "include" }),
      ]);
      const timetable = (await ttRes.json()).timetable || [];
      const records = (await recRes.json()).records || [];
      const profile = (await profRes.json()).student;

      if (timetable.length === 0) {
        box.innerHTML = `<div class="panel-empty">No subjects on your timetable yet.</div>`;
        return;
      }

      const today = toDateOnly(new Date());
      let startDate = profile && profile.enrollment_date ? toDateOnly(profile.enrollment_date) : null;
      const earliestAllowed = toDateOnly(new Date());
      earliestAllowed.setDate(earliestAllowed.getDate() - 180); // safety cap: don't look back more than ~6 months
      if (!startDate || startDate < earliestAllowed) startDate = earliestAllowed;

      // Group timetable slots by subject
      const slotsBySubject = {};
      timetable.forEach((slot) => {
        if (!slotsBySubject[slot.subject_name]) slotsBySubject[slot.subject_name] = [];
        slotsBySubject[slot.subject_name].push(slot);
      });

      // Index attendance records by "subject|date"
      const recordIndex = {};
      records.forEach((r) => {
        const key = `${r.subject_name}|${toDateOnly(r.attendance_date).toISOString().split("T")[0]}`;
        recordIndex[key] = r;
      });

      const subjectNames = Object.keys(slotsBySubject).sort();
      box.innerHTML = subjectNames
        .map((subject, idx) => {
          const slots = slotsBySubject[subject];
          const daysForSubject = new Set(slots.map((s) => s.day_of_week));

          // Generate every past occurrence of this subject's weekly day(s)
          const sessionDates = [];
          for (let d = new Date(startDate); d <= today; d.setDate(d.getDate() + 1)) {
            if (daysForSubject.has(DAY_NAMES[d.getDay()])) {
              sessionDates.push(new Date(d));
            }
          }

          const sessions = sessionDates.map((date) => {
            const key = `${subject}|${date.toISOString().split("T")[0]}`;
            const record = recordIndex[key];
            return { date, status: record ? record.status : "Absent" };
          });

          const presentCount = sessions.filter((s) => s.status === "Present" || s.status === "Late").length;
          const pct = sessions.length > 0 ? Math.round((presentCount / sessions.length) * 100) : 0;

          const rows = sessions.length
            ? sessions
                .map((s, i) => `
                  <tr>
                    <td>Session ${i + 1}</td>
                    <td>${s.date.toLocaleDateString()}</td>
                    <td>${badgeFor(s.status)}</td>
                  </tr>`)
                .join("")
            : `<tr><td colspan="3" style="text-align:center; color:var(--ink-soft);">No sessions yet.</td></tr>`;

          return `
            <div class="subject-accordion" id="acc-${idx}">
              <div class="subject-accordion-head" onclick="document.getElementById('acc-${idx}').classList.toggle('open')">
                <div class="name">${subject}</div>
                <div class="right">
                  <div class="pct">${pct}%</div>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
              </div>
              <div class="subject-accordion-body">
                <table>
                  <thead><tr><th>Session</th><th>Date</th><th>Status</th></tr></thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>`;
        })
        .join("");
    } catch (err) {
      console.error(err);
      box.innerHTML = `<div class="panel-empty">Could not load attendance records.</div>`;
    }
  }

  async function loadTodayLectures() {
    const res = await fetch(`${API_BASE}/timetable/today`, { credentials: "include" });
    const data = await res.json();
    document.getElementById("todayHeading").textContent = `Today's Lectures (${data.day || ""})`;

    const box = document.getElementById("todayLecturesBody");
    const slots = data.slots || [];
    if (!slots.length) {
      box.innerHTML = `<div class="panel-empty">No lectures scheduled for today.</div>`;
      return;
    }
    box.innerHTML = slots.map((s) => `
      <div class="lecture-row">
        <div class="time-block"><div class="t">${fmtTime(s.start_time)}</div></div>
        <div class="info" style="flex:1;">
          <h4>${s.subject_name}</h4>
          <p>${s.venue || "Venue TBD"}${s.teacher_name ? " · " + s.teacher_name : ""}</p>
        </div>
        ${s.attendance_id
          ? `<span class="badge badge-present">Marked ${s.marked_status}</span>`
          : `<button class="btn btn-navy btn-sm" onclick="openMarkModal(${s.id}, '${s.subject_name.replace(/'/g, "")}')">Mark Attendance</button>`
        }
      </div>`).join("");
  }

  const markModal = document.getElementById("markModal");
  window.openMarkModal = function (timetableId, subjectName) {
    currentTimetableId = timetableId;
    document.getElementById("markLectureLabel").textContent = `Marking attendance for: ${subjectName}`;
    document.getElementById("markForm").reset();
    document.getElementById("markMsg").className = "form-msg";
    markModal.classList.add("open");
  };
  function closeMarkModal() { markModal.classList.remove("open"); }
  document.getElementById("closeMarkModal").addEventListener("click", closeMarkModal);
  document.getElementById("cancelMark").addEventListener("click", closeMarkModal);
  markModal.addEventListener("click", (e) => { if (e.target === markModal) closeMarkModal(); });

  document.getElementById("confirmMarkBtn").addEventListener("click", async () => {
    const password = document.getElementById("markPassword").value;
    const msg = document.getElementById("markMsg");
    if (!password) {
      msg.textContent = "Please enter your password.";
      msg.className = "form-msg error";
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/attendance/self-mark`, {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
        body: JSON.stringify({ timetableId: currentTimetableId, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
            closeMarkModal();
      await loadTodayLectures();
      await loadSummary();
      await loadAttendanceRecords();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = "form-msg error";
    }
  });

  (async function init() {
    const user = await requireStudentSession();
    if (!user) return;
    await loadSummary();
    await loadTodayLectures();
    await loadAttendanceRecords();
  })();
</script>
</body>
</html>
