<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timetable — Student Manager</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="dash">
  <aside class="sidebar">
    <div class="side-profile">
      <div class="side-avatar js-student-initials">—</div>
      <div class="side-profile-text">
        <div class="name js-student-name">—</div>
        <div class="regno js-student-regno">—</div>
      </div>
    </div>
    <nav class="side-links sidebar-scroll">
      <a class="side-link" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="side-link" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </a>
      <a class="side-link" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
        Attendance
      </a>
      <a class="side-link" href="exams.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a class="side-link" href="results.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-6"/></svg>
        Results
      </a>
      <button class="side-link active" data-nav="timetable">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Timetable
      </button>
      <a class="side-link" href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments
      </a>
    </nav>
    <div class="side-user">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h1>Timetable</h1>
        <p>Your weekly lecture schedule.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <div class="card-head"><h2 id="upcomingHeading">Upcoming Lectures</h2></div>
      <div class="card-body" id="upcomingBody">
        <div class="panel-empty">Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Weekly Schedule</h2></div>
      <div class="card-body">
        <div class="week-tabs" id="weekTabs"></div>
        <div id="weekDayBody">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/student-common.js"></script>
<script>
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  let fullTimetable = [];

  function fmtTime(t) {
    if (!t) return "—";
    const [h, m] = t.split(":");
    const hour = parseInt(h, 10);
    const ampm = hour >= 12 ? "PM" : "AM";
    const h12 = hour % 12 || 12;
    return `${h12}:${m} ${ampm}`;
  }

  function renderDay(day) {
    const box = document.getElementById("weekDayBody");
    const slots = fullTimetable.filter((s) => s.day_of_week === day);
    if (!slots.length) {
      box.innerHTML = `<div class="panel-empty">No lectures on ${day}.</div>`;
      return;
    }
    box.innerHTML = slots.map((s) => `
      <div class="lecture-row">
        <div class="time-block"><div class="t">${fmtTime(s.start_time)}</div></div>
        <div class="info" style="flex:1;">
          <h4>${s.subject_name}</h4>
          <p>${s.venue || "Venue TBD"}${s.teacher_name ? " · " + s.teacher_name : ""} · ${s.course_name}</p>
        </div>
      </div>`).join("");
  }

  function renderWeekTabs(defaultDay) {
    const tabsBox = document.getElementById("weekTabs");
    tabsBox.innerHTML = DAYS.map((d) => `<button class="week-tab ${d === defaultDay ? "active" : ""}" data-day="${d}">${d.slice(0, 3)}</button>`).join("");
    tabsBox.querySelectorAll(".week-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        tabsBox.querySelectorAll(".week-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderDay(btn.dataset.day);
      });
    });
    renderDay(defaultDay);
  }

  async function loadTimetable() {
    const res = await fetch(`${API_BASE}/timetable/mine`, { credentials: "include" });
    const data = await res.json();
    fullTimetable = data.timetable || [];

    const todayName = DAYS[(new Date().getDay() + 6) % 7];
    renderWeekTabs(fullTimetable.some((s) => s.day_of_week === todayName) ? todayName : "Monday");
  }

  async function loadUpcoming() {
    const res = await fetch(`${API_BASE}/timetable/upcoming`, { credentials: "include" });
    const data = await res.json();
    document.getElementById("upcomingHeading").textContent = `Upcoming Lectures (${data.day || "Tomorrow"})`;

    const box = document.getElementById("upcomingBody");
    const slots = data.slots || [];
    box.innerHTML = slots.length
      ? slots.map((s) => `
        <div class="lecture-row">
          <div class="time-block"><div class="t">${fmtTime(s.start_time)}</div></div>
          <div class="info" style="flex:1;">
            <h4>${s.subject_name}</h4>
            <p>${s.venue || "Venue TBD"}${s.teacher_name ? " · " + s.teacher_name : ""}</p>
          </div>
        </div>`).join("")
      : `<div class="panel-empty">No lectures scheduled for the next day.</div>`;
  }

  (async function init() {
    const user = await requireStudentSession();
    if (!user) return;
    await loadUpcoming();
    await loadTimetable();
  })();
</script>
</body>
</html>
