<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payments — Student Manager</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="dash">
  <aside class="sidebar">
    <div class="side-profile">
      <div class="side-avatar js-student-initials">—</div>
      <div class="side-profile-text">
        <div class="name js-student-name">—</div>
        <div class="regno js-student-regno">—</div>
      </div>
    </div>
    <nav class="side-links sidebar-scroll">
      <a class="side-link" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="side-link" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </a>
      <a class="side-link" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
        Attendance
      </a>
      <a class="side-link" href="exams.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a class="side-link" href="results.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-6"/></svg>
        Results
      </a>
      <a class="side-link" href="timetable.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Timetable
      </a>
      <button class="side-link active" data-nav="payments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments
      </button>
    </nav>
    <div class="side-user">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h1>Payments</h1>
        <p>Your fee payment history and status.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Payment History</h2></div>
      <div class="card-body table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Fee Type</th><th>Course</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody id="paymentsBody"><tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../js/student-common.js"></script>
<script>
  function statusBadge(status) {
    const cls = status === "Paid" ? "badge-paid" : status === "Partial" ? "badge-partial" : "badge-overdue";
    return `<span class="badge ${cls}">${status === "Overdue" ? "Overdue / Pending" : status}</span>`;
  }

  async function loadPayments() {
    const res = await fetch(`${API_BASE}/payments/me`, { credentials: "include" });
    const data = await res.json();
    const body = document.getElementById("paymentsBody");
    const payments = data.payments || [];

    body.innerHTML = payments.length
      ? payments.map((p) => `
        <tr>
          <td>${new Date(p.payment_date).toLocaleDateString()}</td>
          <td>${p.fee_type}</td>
          <td>${p.course_name || "—"}</td>
          <td>${p.payment_method}</td>
          <td>Rs. ${Number(p.amount).toLocaleString()}</td>
          <td>${statusBadge(p.status)} ${p.reminder_sent_at ? '<span class="badge badge-late" style="margin-left:4px;">Reminder sent</span>' : ""}</td>
        </tr>`).join("")
      : `<tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">No payment records yet.</td></tr>`;
  }

  (async function init() {
    const user = await requireStudentSession();
    if (!user) return;
    await loadPayments();
  })();
</script>
</body>
</html>
