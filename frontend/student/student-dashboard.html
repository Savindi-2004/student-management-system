<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Student Manager</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="dash">
  <aside class="sidebar">
    <div class="side-profile">
      <div class="side-avatar js-student-initials">—</div>
      <div class="side-profile-text">
        <div class="name js-student-name">—</div>
        <div class="regno js-student-regno">—</div>
      </div>
    </div>
    <nav class="side-links sidebar-scroll">
      <button class="side-link active" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <a class="side-link" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </a>
      <a class="side-link" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
        Attendance
      </a>
      <a class="side-link" href="exams.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <a class="side-link" href="results.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-6"/></svg>
        Results
      </a>
      <a class="side-link" href="timetable.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Timetable
      </a>
      <a class="side-link" href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments
      </a>
    </nav>
    <div class="side-user">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="welcome-banner">
      <h1 id="welcomeHeading">Welcome back! 👋</h1>
      <p>Here's what's happening with your studies today.</p>
    </div>
    <div id="paymentReminderBanner"></div>
    <div class="mini-stat-grid">
      <div class="mini-stat">
        <div class="label">Attendance</div>
        <div class="value" id="miniAttendance">—</div>
        <div class="sub" id="miniAttendanceSub">Loading...</div>
      </div>
      <div class="mini-stat">
        <div class="label">Upcoming Exams</div>
        <div class="value" id="miniExams">—</div>
        <div class="sub" id="miniExamsSub">Loading...</div>
      </div>
      <div class="mini-stat">
        <div class="label">Timetable</div>
        <div class="value" id="miniLecture" style="font-size:1.1rem;">—</div>
        <div class="sub" id="miniLectureSub">Loading...</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:22px;">
      <div class="card">
        <div class="card-head"><h2>Today's Lectures</h2><a href="attendance.html" class="btn btn-ghost btn-sm">Go to Attendance</a></div>
        <div class="card-body" id="todayLecturesBody">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Upcoming Exams</h2><a href="exams.html" class="btn btn-ghost btn-sm">View all</a></div>
        <div class="card-body" id="upcomingExamsBody">
          <div class="panel-empty">Loading...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/student-common.js"></script>
<script>
  function fmtTime(t) {
    if (!t) return "—";
    const [h, m] = t.split(":");
    const hour = parseInt(h, 10);
    const ampm = hour >= 12 ? "PM" : "AM";
    const h12 = hour % 12 || 12;
    return `${h12}:${m} ${ampm}`;
  }
  async function loadPaymentReminders() {
    try {
      const res = await fetch(`${API_BASE}/payments/me`, { credentials: "include" });
      const data = await res.json();
      const flagged = (data.payments || []).filter((p) => p.reminder_sent_at && p.status !== "Paid");

      const box = document.getElementById("paymentReminderBanner");
      if (flagged.length === 0) {
        box.innerHTML = "";
        return;
      }
      const p = flagged[0];
      box.innerHTML = `
        <div class="notify-banner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          <div class="body">
            <strong>Payment reminder</strong>
            <span>Your ${p.fee_type.toLowerCase()} (Rs. ${Number(p.amount).toLocaleString()}) is marked ${p.status.toLowerCase()}${flagged.length > 1 ? ` — ${flagged.length} payments need attention` : ""}.</span>
          </div>
          <a href="payments.html" class="btn btn-danger btn-sm">View Payments</a>
        </div>`;
    } catch (err) {
      console.error(err);
    }
  }
  async function loadMiniStats() {
    try {
      const [attRes, examRes, todayRes] = await Promise.all([
        fetch(`${API_BASE}/attendance/me/summary`, { credentials: "include" }).then((r) => r.json()),
        fetch(`${API_BASE}/exams/mine`, { credentials: "include" }).then((r) => r.json()),
        fetch(`${API_BASE}/timetable/today`, { credentials: "include" }).then((r) => r.json()),
      ]);

      document.getElementById("miniAttendance").textContent = attRes.overallPercentage + "%";
      document.getElementById("miniAttendanceSub").textContent = `${attRes.present} present, ${attRes.absent} absent`;

      const today = new Date().toISOString().split("T")[0];
      const upcoming = (examRes.exams || []).filter((e) => e.exam_date && e.exam_date.split("T")[0] >= today);
      document.getElementById("miniExams").textContent = upcoming.length;
      document.getElementById("miniExamsSub").textContent = upcoming.length
        ? `Next: ${upcoming[0].exam_name}`
        : "No upcoming exams";

      const slots = todayRes.slots || [];
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();
      const next = slots.find((s) => {
        const [h, m] = s.start_time.split(":");
        return parseInt(h) * 60 + parseInt(m) >= nowMinutes;
      });
      if (next) {
        document.getElementById("miniLecture").textContent = next.subject_name;
        document.getElementById("miniLectureSub").textContent = `${fmtTime(next.start_time)} · ${next.venue || "TBD"}`;
      } else {
        document.getElementById("miniLecture").textContent = "No more today";
        document.getElementById("miniLectureSub").textContent = slots.length ? "All done for today" : "No lectures today";
      }

      renderTodayLectures(slots);
      renderUpcomingExams(upcoming.slice(0, 4));
    } catch (err) {
      console.error(err);
    }
  }

  function renderTodayLectures(slots) {
    const box = document.getElementById("todayLecturesBody");
    if (!slots.length) {
      box.innerHTML = `<div class="panel-empty">No lectures scheduled for today.</div>`;
      return;
    }
    box.innerHTML = slots.map((s) => `
      <div class="lecture-row">
        <div class="time-block"><div class="t">${fmtTime(s.start_time)}</div></div>
        <div class="info" style="flex:1;">
          <h4>${s.subject_name}</h4>
          <p>${s.venue || "Venue TBD"}${s.teacher_name ? " · " + s.teacher_name : ""}</p>
        </div>
        ${s.marked_status ? `<span class="badge badge-present">Marked</span>` : ""}
      </div>`).join("");
  }

  function renderUpcomingExams(exams) {
    const box = document.getElementById("upcomingExamsBody");
    if (!exams.length) {
      box.innerHTML = `<div class="panel-empty">No upcoming exams for your course.</div>`;
      return;
    }
    box.innerHTML = exams.map((e) => `
      <div style="padding:12px 0; border-bottom:1px solid var(--border);">
        <div style="font-weight:600; color:var(--navy-900); font-size:0.92rem;">${e.exam_name}</div>
        <div style="font-size:0.82rem; color:var(--ink-soft); margin-top:3px;">${e.exam_type} · ${e.exam_date ? new Date(e.exam_date).toLocaleDateString() : "TBD"}</div>
      </div>`).join("");
  }

  (async function init() {
    const user = await requireStudentSession();
    if (!user) return;
    document.getElementById("welcomeHeading").textContent = `Welcome back, ${user.name.split(" ")[0]}! 👋`;
    await loadPaymentReminders();
    await loadMiniStats();
  })();
</script>
</body>
</html>
