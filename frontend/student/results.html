<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results — Student Manager</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div class="dash">
  <aside class="sidebar">
    <div class="side-profile">
      <div class="side-avatar js-student-initials">—</div>
      <div class="side-profile-text">
        <div class="name js-student-name">—</div>
        <div class="regno js-student-regno">—</div>
      </div>
    </div>
    <nav class="side-links sidebar-scroll">
      <a class="side-link" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="side-link" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </a>
      <a class="side-link" href="attendance.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>
        Attendance
      </a>
      <a class="side-link" href="exams.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exams
      </a>
      <button class="side-link active" data-nav="results">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 4 4 5-6"/></svg>
        Results
      </button>
      <a class="side-link" href="timetable.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        Timetable
      </a>
      <a class="side-link" href="payments.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments
      </a>
    </nav>
    <div class="side-user">
      <button class="btn btn-outline btn-sm btn-block" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h1>Results</h1>
        <p>Your exam results, published by the admin.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <div class="card-head"><h2>Upcoming Exams</h2></div>
      <div class="card-body" id="upcomingExamsBody">
        <div class="panel-empty">Loading...</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>My Results</h2></div>
      <div class="card-body table-wrap">
        <table>
          <thead><tr><th>Exam</th><th>Reg. No.</th><th>Student</th><th>Marks</th><th>Grade</th><th>Attendance</th></tr></thead>
          <tbody id="resultsBody"><tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../js/student-common.js"></script>
<script>
  function gradeBadge(grade) { return grade ? `<span class="badge badge-grade">${grade}</span>` : "—"; }
  function attBadge(att) {
    return `<span class="badge ${att === "Absent" ? "badge-absent" : "badge-present"}">${att}</span>`;
  }

  async function loadUpcomingExams() {
    const res = await fetch(`${API_BASE}/exams/mine`, { credentials: "include" });
    const data = await res.json();
    const today = new Date().toISOString().split("T")[0];
    const upcoming = (data.exams || []).filter((e) => e.exam_date && e.exam_date.split("T")[0] >= today);

    const box = document.getElementById("upcomingExamsBody");
    box.innerHTML = upcoming.length
      ? upcoming.map((e) => `
        <div style="padding:12px 0; border-bottom:1px solid var(--border);">
          <div style="font-weight:600; color:var(--navy-900); font-size:0.92rem;">${e.exam_name}</div>
          <div style="font-size:0.82rem; color:var(--ink-soft); margin-top:3px;">${e.exam_type} · ${new Date(e.exam_date).toLocaleDateString()}${e.venue ? " · " + e.venue : ""}</div>
        </div>`).join("")
      : `<div class="panel-empty">No upcoming exams for your course.</div>`;
  }

  async function loadResults() {
    const [meRes, resultsRes, profData] = await Promise.all([
      fetch(`${API_BASE}/auth/me`, { credentials: "include" }).then((r) => r.json()),
      fetch(`${API_BASE}/exams/my-results`, { credentials: "include" }).then((r) => r.json()),
      fetch(`${API_BASE}/students/me/profile`, { credentials: "include" }).then((r) => r.json()),
    ]);
    const regNo = profData.student ? profData.student.student_reg_no : "—";
    const name = meRes.user ? meRes.user.name : "—";

    const body = document.getElementById("resultsBody");
    const results = resultsRes.results || [];
    body.innerHTML = results.length
      ? results.map((r) => `
        <tr>
          <td>${r.exam_name}</td>
          <td><span class="reg-no">${regNo}</span></td>
          <td>${name}</td>
          <td>${r.marks}</td>
          <td>${gradeBadge(r.grade)}</td>
          <td>${attBadge(r.attendance)}</td>
        </tr>`).join("")
      : `<tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">No results published yet.</td></tr>`;
  }

  (async function init() {
    const user = await requireStudentSession();
    if (!user) return;
    await loadUpcomingExams();
    await loadResults();
  })();
</script>
</body>
</html>
